<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Apps simples</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f4f1ea;
      color: #1f2933;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 600;
    }

    p {
      margin: 0;
      line-height: 1.45;
      font-size: 1.05rem;
    }

    a {
      display: flex;
      align-items: center;
      min-height: 72px;
      margin-top: 20px;
      padding: 16px 18px;
      background: #fff;
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      font-size: 1.35rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Apps simples</h1>
    <p>Cosas pequeñas para el día a día.</p>
    <a href="apps/ingles/">Inglés</a>
  </main>
</body>
</html>
